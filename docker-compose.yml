# Deploys the whole turborepo as one unit (two containers: api + web).
# Works with `docker compose up -d` and with Coolify's "Docker Compose" build pack.
#
# See .env.example for the full variable reference. The API validates all of it
# at startup and refuses to boot on a bad value.
#
# Both services sit behind one reverse proxy on a single public origin, which
# forwards /api to the api service and everything else to web:
#   PUBLIC_ORIGIN=https://example.com
#   API_PUBLIC_URL=https://example.com/api
#   NEXT_PUBLIC_API_URL=/api
#   TRUST_PROXY=1
#
# Do not publish the api port to the internet: while it is directly reachable,
# X-Forwarded-For can be forged and TRUST_PROXY is unsafe.

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # Bound to loopback: the reverse proxy reaches the api over the compose
    # network, and nothing else should reach it directly. The image applies
    # packages/db migrations on start, then serves.
    ports:
      - "127.0.0.1:4001:4001"
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      RESEND_API_KEY: ${RESEND_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
      API_PUBLIC_URL: ${API_PUBLIC_URL}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      EMAIL_FROM: ${EMAIL_FROM}

  web:
    build:
      context: .
      dockerfile: apps/sketch-forge/Dockerfile
      args:
        # Baked into the client bundle at build time.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Server-side Next fetches reach the api over the internal docker network.
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:4001}
